[package]
name = "wayland-file-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Async runtime (io_uring will be added after unstable cfg is set)
tokio = { version = "1.46", features = ["full"] }

# Directories
dirs = "5.0"

# GTK4 GUI - gtk4 pulls in gdk4, gio, glib automatically
gtk4 = "0.11"
gdk4-wayland = "0.11"
glib = "0.22"

# File system operations
walkdir = "2.5"
notify = "7.0"
notify-debouncer-mini = "0.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
once_cell = "1.20"
parking_lot = "0.12"
rayon = "1.10"
lru = "0.12"
chrono = "0.4"

# Image handling for thumbnails
image = "0.25"

# Async channels
flume = "0.11"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "wayland_file_manager"
path = "src/lib.rs"

[[bin]]
name = "wayland-file-manager"
path = "src/main.rs"